<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameWIKI - 本地遊戲攻略資料庫</title>
  <script type="module" src="/src/main.js"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased selection:bg-purple-500/30">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-40 w-full backdrop-blur flex-none transition-colors duration-500 lg:z-50 lg:border-b lg:border-slate-50/10 bg-slate-900/80">
      <div class="max-w-8xl mx-auto px-4 sm:px-6 md:px-8">
        <div class="py-4 border-b border-slate-50/10 lg:px-8 lg:border-0 flex items-center justify-between">
          <div class="flex items-center">
            <a class="flex items-center gap-2 hover:opacity-80 transition-opacity" href="/#/">
               <span class="text-2xl">🎮</span>
               <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">GameWIKI</span>
            </a>
          </div>
          <div class="relative w-full max-w-md ml-8 hidden sm:block">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
              </svg>
            </div>
            <input type="search" id="global-search" class="block w-full p-2 pl-10 text-sm text-gray-100 bg-gray-800 border border-gray-700 rounded-lg focus:ring-purple-500 focus:border-purple-500 placeholder-gray-400" placeholder="搜尋攻略內容...">
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-8xl mx-auto w-full">
      <div id="router-view" class="w-full">
        <!-- Route content will be injected here -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 text-center text-sm text-gray-500 border-t border-gray-800 bg-gray-900/50 backdrop-blur">
      <p>GameWIKI - 本地遊戲攻略知識庫 v1.0</p>
    </footer>
  </div>

  <!-- Fullscreen Image Viewer Modal -->
  <div id="image-modal" class="fixed inset-0 z-[100] hidden bg-black/90 backdrop-blur-sm transition-opacity duration-300 opacity-0 flex items-center justify-center p-4">
    <button id="close-modal" class="absolute top-4 right-4 text-white hover:text-gray-300 transition-colors p-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <img id="modal-image" src="" alt="Enlarged view" class="max-w-full max-h-full object-contain rounded shadow-2xl scale-95 transition-transform duration-300">
  </div>
</body>
</html>
